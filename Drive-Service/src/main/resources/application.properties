spring.application.name=Drive-Service
   # defines the logical name of the Spring Boot application
server.port = 8091
  # Run this application on port 8081.
eureka.client.enabled = false
 #  Drive-Service will not register itself with Eureka
spring.datasource.url=jdbc:h2:file:./data/drive
# creates an file based db which is persistent after the restarting application

spring.datasource.username=sa
# System Administrator default name
spring.datasource.password=
#we use the environmental variable to store the password outside the source code
spring.jpa.hibernate.ddl-auto=update
# update the db schema to match the entity structure
#. I commonly use it during development because it allows entity changes to be reflected in the database
# without manually writing ALTER TABLE statements.

spring.jpa.open-in-view=false
# disables the Open Session in View pattern, It can help prevent unexpected lazy-loading queries.

# multipart request can contain: file data, metadata, multiple files that's why its size it bigger than the file size
             # A representation of an uploaded file received in multipart request  act as temporary storage
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.max-file-size=10MB

spring.mvc.problemdetails.enabled=true
# give problem details in detail
management.endpoints.web.exposure.include=health,info
# exposing these 2 actuator endpoints

drive.storage.url=http://localhost:8092
# storage service url

